<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>DevConnect Pro</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>DevConnect Pro 🚀</h1>

    <p class="subtitle">
      Explore developers, repositories, and technologies.
    </p>
  </header>

  <!-- Search -->
  <section class="search-section">

    <input
      type="text"
      id="searchInput"
      placeholder="Search GitHub username..."
    />

    <button onclick="searchUser()">
      Search
    </button>

  </section>

  <!-- Profile -->
  <section id="profile"></section>

  <!-- Repo Search -->
  <section class="repo-search">

    <input
      type="text"
      id="repoSearch"
      placeholder="Filter repositories..."
      onkeyup="filterRepos()"
    />

  </section>

  <!-- Repositories -->
  <section class="repo-section">

    <h2>Top Repositories 📦</h2>

    <div id="repos"></div>

  </section>

  <!-- Saved Users -->
  <section class="saved-section">

    <h2>Saved Developers ⭐</h2>

    <div id="savedUsers"></div>

  </section>

  <script src="app.js"></script>

</body>

</html>
