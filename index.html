<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>DevConnect Ultra 🚀</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Header -->

  <header>

    <h1>DevConnect Ultra 🚀</h1>

    <p class="subtitle">
      Discover developers and explore their GitHub universe.
    </p>

  </header>

  <!-- Search -->

  <section class="search-section">

    <input
      type="text"
      id="searchInput"
      placeholder="Search GitHub username..."
    />

    <button onclick="searchUser()">
      Search
    </button>

  </section>

  <!-- Profile -->

  <section id="profile"></section>

  <!-- Repository Search -->

  <section class="repo-search">

    <input
      type="text"
      id="repoSearch"
      placeholder="Filter repositories..."
      onkeyup="filterRepos()"
    />

  </section>

  <!-- Repository Section -->

  <section class="repo-section">

    <h2>Top Repositories 📦</h2>

    <div id="repos"></div>

  </section>

  <!-- Saved Users -->

  <section class="saved-section">

    <h2>Saved Developers ⭐</h2>

    <div id="savedUsers"></div>

  </section>

  <!-- Toast -->

  <div id="toast"></div>

  <script src="app.js"></script>

</body>

</html>
