<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DevConnect Pro</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Header -->
  <header>
    <h1>DevConnect Pro 🚀</h1>
    <p class="subtitle">
      Search developers, explore repositories, and save profiles.
    </p>
  </header>

  <!-- Search Section -->
  <section class="search-section">

    <input
      type="text"
      id="searchInput"
      placeholder="Enter GitHub username..."
    />

    <button onclick="searchUser()">
      Search
    </button>

  </section>

  <!-- Profile -->
  <section id="profile"></section>

  <!-- Repository Section -->
  <section class="repo-section">

    <h2>Top Repositories 📦</h2>

    <div id="repos"></div>

  </section>

  <!-- Saved Developers -->
  <section class="saved-section">

    <h2>Saved Developers ⭐</h2>

    <div id="savedUsers"></div>

  </section>

  <script src="app.js"></script>

</body>

</html>
